# KAP Notifier yapılandırması
# Sırlar (şifre, API anahtarı) bu dosyaya YAZILMAZ; ortam değişkeni / GitHub Secrets kullanılır.

timezone: Europe/Istanbul

# Boş liste = tüm şirketler.
# Doluysa şirket unvanı içinde bu metinlerden biri geçmelidir (büyük/küçük harf duyarsız).
# Örnek: ["ASELSAN", "TÜPRAŞ", "THY"]
companies: []

filters:
  # Bildirim türü allowlist'i. Boş bırakılırsa tüm türler denenir.
  subject_allow:
    - "Özel Durum Açıklaması"
    - "Finansal Rapor"
    - "Payların Geri Alınmasına İlişkin Bildirim"
    - "Sermaye Artırımı"
    - "İhraç Tavanına İlişkin Bildirim"
    - "Kâr Dağıtımı"
    - "Temettü"
    - "Genel Kurul"
    - "Birleşme"
    - "Bölünme"
    - "Satın Alma"
    - "Kredi Derecelendirmesi"
    - "Faaliyet Raporu"

  # Gürültüyü kesen sert deny listesi. Bu türler hiç gönderilmez.
  subject_deny:
    - "Portföy Dağılım Raporu"
    - "Pay Bazında Devre Kesici"
    - "Borsa Dışı Repo"
    - "Ters Repo"
    - "Piyasa Yapıcılığı"
    - "Yatırımcı Bilgi Formu"
    - "Fon Sürekli Bilgilendirme"
    - "Tanıtım Formu"
    - "İç Tüzük"
    - "İzahname"
    - "Şirket Genel Bilgi Formu"

  # Konu/özet/şirket metninde aranan kelimeler. Skoru artırır.
  include_keywords:
    - "temettü"
    - "kâr dağıtımı"
    - "sermaye artırımı"
    - "bedelli"
    - "bedelsiz"
    - "geri alım"
    - "ihale"
    - "sözleşme"
    - "satın alma"
    - "birleşme"
    - "yatırım"
    - "kredi"
    - "derecelendirme"
    - "genel kurul"
    - "faaliyet raporu"
    - "halka arz"
    - "temlik"
    - "ipotek"
    - "dava"
    - "ceza"
    - "soruşturma"
    - "üretim"
    - "kapasite"
    - "tesis"
    - "lisans"
    - "ihracat"
    - "finansman"
    - "borçlanma"

  # Bu kelimelerden biri geçerse bildirim gönderilmez.
  exclude_keywords:
    - "portföy dağılım"
    - "devre kesici"

  # true yaparsan allowlist'e uysa bile en az bir include keyword aranır.
  require_keyword: false

  # 1 = allowlist eşleşmesi yeterli. 2+ = ek keyword/şirket eşleşmesi ister.
  min_score: 1

  # Mali analist filtresi: rutin işlemleri ayıklar, maddi olayları öne çıkarır.
  analyst:
    enabled: true

    # Rutin konu + maddi istisna yoksa bildirim gönderilmez.
    drop_routine: true
    routine_topics:
      - "payların geri alınmasına ilişkin bildirim"
      - "pay geri alım"
      - "geri alım işlemleri"
      - "yönetim kurulu üyeliği"
      - "yönetim kurulu üyesi"
      - "yönetim kurulu üye değişikliği"
      - "yönetim kurulu üyesinin istifası"
      - "üye istifası"
      - "genel müdür atanması"
      - "genel müdürün istifası"
      - "bağımsız denetçi"
      - "sorumlu yönetici"
      - "ağırlıklı ortalama fiyat"
      - "net aktif değer"

    # Rutin konuyu istisnaya çeviren maddi olaylar.
    override_keywords:
      - "temerrüt"
      - "iflas"
      - "konkordato"
      - "tasfiye"
      - "not indirimi"
      - "not düşür"
      - "sermaye kaybı"
      - "borca batık"
      - "olağanüstü"
      - "kayyum"
      - "tutuklama"
      - "gözaltı"
      - "vefat"
      - "soruşturma"
      - "ceza"
      - "dava"
      - "yapılandırma"
      - "likidite"
      - "nakit akışı"
      - "satın alma"
      - "birleşme"
      - "bölünme"
      - "devralma"
      - "hisse devri"
      - "yatırım"
      - "sermaye artırımı"
      - "temettü"
      - "kâr dağıtımı"
      - "finansal zorluk"

    # Doğrudan kritik kabul edilen olaylar (e-posta başlığında "kritik" sayılır).
    critical_keywords:
      - "temerrüt"
      - "iflas"
      - "konkordato"
      - "tasfiye"
      - "not indirimi"
      - "not düşür"
      - "derecelendirme notunun düşürülmesi"
      - "sermaye kaybı"
      - "borca batık"
      - "faaliyetlerin durdurulması"
      - "üretime ara"
      - "tmsf"
      - "el konulması"
      - "kayyum"

    # Analiz gerektiren yüksek değerli olaylar.
    high_value_keywords:
      - "yatırım kararı"
      - "yatırım"
      - "kapasite"
      - "yeni tesis"
      - "fabrika"
      - "ihale"
      - "sözleşme"
      - "satın alma"
      - "birleşme"
      - "bölünme"
      - "devralma"
      - "hisse devri"
      - "temettü"
      - "kâr dağıtımı"
      - "sermaye artırımı"
      - "bedelli"
      - "bedelsiz"
      - "halka arz"
      - "finansman"
      - "borçlanma"
      - "likidite"
      - "nakit akışı"
      - "yapılandırma"
      - "ihracat"
      - "lisans"
      - "üretim"
      - "dava"
      - "ceza"
      - "soruşturma"
      - "vefat"

  # E-postada üstte gösterilecek öncelikli türler.
  priority_subjects:
    - "Özel Durum Açıklaması"
    - "Payların Geri Alınmasına İlişkin Bildirim"
    - "Sermaye Artırımı"
    - "Kâr Dağıtımı"
    - "Temettü"

  # Tek e-postada gönderilecek maksimum bildirim.
  # Fazlası ayrı e-postalara bölünür; hiçbiri atlanmaz.
  max_items: 40

quiet_hours:
  # 00:00-08:00 arası e-posta gönderilmez; birikenler 08:05'te gelir.
  enabled: true
  start: "00:00"
  end: "08:00"

llm:
  enabled: true
  provider: gemini
  # 3.5 Flash: 3.5 Flash-Lite'a göre Türkçe metin kalitesi belirgin daha iyi.
  model: gemini-3.5-flash-lite
  # Yoğun saatlerde 503 gelirse bu modele düşülür; hızlı ve genelde müsait.
  fallback_model: gemini-3.1-flash-lite
  api_key_env: GEMINI_API_KEY
  batch_size: 5
  # Her e-posta parçasındaki tüm bildirimlerin özetlenmesi için 40+ seç.
  max_items_per_run: 60
  timeout_seconds: 60

ratings:
  # Kredi derecelendirme bildirimlerinin ekini indirip firma/not/aksiyon çıkarır.
  enabled: true
  # Tek çalışmada en fazla kaç derecelendirme bildirimi için detay/ek indirilir.
  max_items_per_run: 25
  max_attachments: 2
  max_pdf_bytes: 15000000
  timeout_seconds: 45

documents:
  # Seçili bildirimlerin PDF eklerini okuyup AI özetine ve analiz noktalarına
  # girdi olarak verir. Ek yoksa o bildirim için indirme yapılmaz.
  enabled: true
  # KAP 429 riski nedeniyle tek çalışmada sınırlı sayıda bildirim okunur.
  # Öncelik kritik/yüksek maddiyetli bildirimlere verilir.
  max_items_per_run: 8
  max_attachments: 2
  # Tek bildirim için modele giden en fazla karakter (yaklaşık 1.5-2 bin token).
  max_chars: 6000
  max_pdf_bytes: 15000000
  timeout_seconds: 30
  # İstekler arasında kibarca bekleme (saniye).
  request_delay_seconds: 0.4

email:
  subject_prefix: "KAP"
  # Alıcılar KAP_EMAIL_TO ortam değişkeni ile verilir (virgülle ayrılabilir).