name: KAP Notifier

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kap-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # LLM süre bütçesi (config.yaml: llm.max_run_seconds) 10 dakika; geri kalan
    # süre KAP indirme, özetleme ve e-posta gönderimi için ayrıldı. State
    # yalnızca iş sonunda push edildiği için işin kesilmemesi önemlidir:
    # kesilirse gönderilmiş bildirimler bir sonraki saatte tekrar gönderilir.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements-lock.txt

      - name: State worktree hazırla
        run: |
          STATE_WT="$RUNNER_TEMP/kap-state"
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            git worktree add "$STATE_WT" origin/state
          else
            git worktree add --detach "$STATE_WT"
            cd "$STATE_WT"
            git checkout --orphan state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$STATE_WT/state"

      - name: Çalıştır
        env:
          KAP_STATE_DIR: ${{ runner.temp }}/kap-state/state
          KAP_SMTP_HOST: ${{ secrets.KAP_SMTP_HOST }}
          KAP_SMTP_PORT: ${{ secrets.KAP_SMTP_PORT }}
          KAP_SMTP_USER: ${{ secrets.KAP_SMTP_USER }}
          KAP_SMTP_PASS: ${{ secrets.KAP_SMTP_PASS }}
          KAP_EMAIL_FROM: ${{ secrets.KAP_EMAIL_FROM }}
          KAP_EMAIL_TO: ${{ secrets.KAP_EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python main.py

      - name: State'i kaydet
        if: always()
        run: |
          cd "$RUNNER_TEMP/kap-state"
          git add state
          if git diff --cached --quiet; then
            echo "State değişmedi"
            exit 0
          fi
          git config user.name "kap-notifier[bot]"
          git config user.email "kap-notifier[bot]@users.noreply.github.com"
          git commit -m "state: $(date -u +%FT%TZ)"
          git push origin HEAD:state